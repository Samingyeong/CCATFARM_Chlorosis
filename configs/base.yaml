# 공통 설정. 단계별 config는 `base: base.yaml`로 이 파일을 상속하고 필요한 값만 덮어쓴다.
# null 값은 아직 확정되지 않은 항목이다.

project: potato_chlorosis
seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  refined_labels_dir: data/refined_labels
  splits_dir: data/splits
  output_root: outputs

dataset:
  name: potato_chlorosis
  # 원본 압축: data/raw/Potato Crop abiotic stressors interveinal Chlorosis and Leaf Curling.rar
  # 압축 해제본(읽기 전용): <dataset.root>/images/*.png, <dataset.root>/labels/*.txt (파일명 stem 1:1)
  root: data/raw/potato_chlorosis
  images_dir: images
  labels_dir: labels
  # YOLO segmentation: 한 줄 = 한 instance, "class_id x1 y1 x2 y2 ..." (0~1 정규화 polygon)
  annotation_format: yolo_seg
  official_split: false     # 데이터셋에 train/val/test split 없음 (Phase 1에서 직접 생성)
  split_level: image        # leaf crop이 아닌 원본 이미지 단위로 split (leakage 방지)

# 원본 annotation의 class id → 이름 (2026-10-05 사용자 확인)
# 원본 표기: 0 Unknown / 1 Interveinal chlorosis / 2 Leaf curling / 3 Healthy
raw_class_map:
  0: Unknown
  1: Chlorosis               # Interveinal Chlorosis
  2: Leaf Curling
  3: Healthy

# 최종 판별 대상 class (Unknown 제외). 원본 id 순서와 다르므로 raw_class_map으로 변환해서 사용한다.
classes:
  - Healthy
  - Chlorosis
  - Leaf Curling

unknown_label: Unknown      # pseudo-label refinement 대상 (원본 id 0)

visualization:
  colors:
    Healthy: green
    Chlorosis: yellow
    Leaf Curling: orange
    Unknown: gray
